name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs to mint an id-token for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a push can't
# leave the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fails the build on a service worker precaching a file that isn't
      # shipped, a manifest icon that would 404, or a missing module - all of
      # which break the installed app silently rather than visibly.
      - name: Build and verify site
        run: node tools/build_site.mjs _site

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on for the repo on the first run, if it isn't already.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
